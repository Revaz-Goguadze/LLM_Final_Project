project:
  name: "LLM Code Review"
  max_context_tokens: 6000

models:
  - name: "gemini-free"
    provider: "gemini"
    enabled: true

rag:
  primary:
    provider: "vector_store"
    top_k: 12
  secondary:
    provider: "docs"
    top_k: 6

evaluation:
  metrics: ["precision", "recall", "fix_rate"]
  max_fix_attempts: 3
